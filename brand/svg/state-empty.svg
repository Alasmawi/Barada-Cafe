<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210" role="img" aria-label="No cups brewing yet">
<title>No cups brewing yet</title>
<style>.holo{animation:flick 5s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}41%{opacity:.82}42%{opacity:1}43%{opacity:.9}44%{opacity:1}78%{opacity:.88}79%{opacity:1}}.steam{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:rise 3s ease-in-out infinite}
.s2{animation-delay:1s}.s3{animation-delay:2s}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}35%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.wait{transform-box:view-box;transform-origin:0 0;animation:wait 4s ease-in-out infinite}
@keyframes wait{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.ghost{animation:ghost 2.4s ease-in-out infinite}
@keyframes ghost{0%,100%{opacity:.35}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
