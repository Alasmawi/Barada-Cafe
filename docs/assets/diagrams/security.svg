<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="t d">
<title id="t">How a request is protected</title>
<desc id="d">Six server-side steps: HTTPS at the edge, security headers, session cookie, Zod validation, role and ownership checks, and parameterised guarded SQL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66594f"/></marker></defs>
<style>
.flow { fill: none; stroke-width: 2.4; stroke-dasharray: 4 10; stroke-opacity: 0; animation: flow 1.2s linear infinite; }
@keyframes flow { from { stroke-dashoffset: 14; stroke-opacity: .8; } to { stroke-dashoffset: 0; stroke-opacity: .8; } }
.pkt { opacity: 0; offset-rotate: 0deg; animation: pkt 6s linear infinite; }
@keyframes pkt { 0% { offset-distance: 0%; opacity: 1; } 15.00% { offset-distance: 100%; opacity: 1; } 15.60%, 100% { offset-distance: 100%; opacity: 0; } }
.rise { animation: rise .7s cubic-bezier(.2,.7,.1,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .flow, .pkt, .rise { animation: none; } .pkt { opacity: 0; } }
</style>
<rect width="1400" height="560" rx="22" fill="#faf5ea"/>
<text x="40" y="62" font-family="Ultra, 'Rockwell Extra Bold', Rockwell, Georgia, serif" font-size="34" font-weight="900" fill="#241a16" text-anchor="start">How a request is protected</text><text x="42" y="92" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#66594f" text-anchor="start">Each step a request passes through, and what it stops. Every check runs on the server.</text><rect x="40" y="108" width="1320" height="1.5" fill="#e6dccb"/><g class="rise" style="animation-delay:0.00s"><rect x="40" y="160" width="200" height="250" rx="16" fill="#fdebd9" stroke="#f38020" stroke-width="1.6"/><circle cx="70" cy="160" r="15" fill="#f38020"/><text x="70" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">1</text><rect x="110" y="184" width="60" height="60" rx="14" fill="#fffdf8" stroke="#e6dccb"/><svg x="125" y="199" width="30" height="30" viewBox="0 0 24 24"><path d="M16.5088 16.8447c.1475-.5068.0908-.9707-.1553-1.3154-.2246-.3164-.6045-.499-1.0615-.5205l-8.6592-.1123a.1559.1559 0 0 1-.1333-.0713c-.0283-.042-.0351-.0986-.021-.1553.0278-.084.1123-.1484.2036-.1562l8.7359-.1123c1.0351-.0489 2.1601-.8868 2.5537-1.9136l.499-1.3013c.0215-.0561.0293-.1128.0147-.168-.5625-2.5463-2.835-4.4453-5.5499-4.4453-2.5039 0-4.6284 1.6177-5.3876 3.8614-.4927-.3658-1.1187-.5625-1.794-.499-1.2026.119-2.1665 1.083-2.2861 2.2856-.0283.31-.0069.6128.0635.894C1.5683 13.171 0 14.7754 0 16.752c0 .1748.0142.3515.0352.5273.0141.083.0844.1475.1689.1475h15.9814c.0909 0 .1758-.0645.2032-.1553l.12-.4268zm2.7568-5.5634c-.0771 0-.1611 0-.2383.0112-.0566 0-.1054.0415-.127.0976l-.3378 1.1744c-.1475.5068-.0918.9707.1543 1.3164.2256.3164.6055.498 1.0625.5195l1.8437.1133c.0557 0 .1055.0263.1329.0703.0283.043.0351.1074.0214.1562-.0283.084-.1132.1485-.204.1553l-1.921.1123c-1.041.0488-2.1582.8867-2.5527 1.914l-.1406.3585c-.0283.0713.0215.1416.0986.1416h6.5977c.0771 0 .1474-.0489.169-.126.1122-.4082.1757-.837.1757-1.2803 0-2.6025-2.125-4.727-4.7344-4.727" fill="#F38020"/></svg><text x="140" y="276" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241a16" text-anchor="middle">Edge</text><text x="140" y="300" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">HTTPS only</text><rect x="54" y="338" width="172" height="56" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="140" y="358" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#f38020" text-anchor="middle" letter-spacing="1.4">STOPS</text><text x="140" y="378" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#241a16" text-anchor="middle">eavesdropping</text></g><path d="M240,285 L262,285" fill="none" stroke="#66594f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M240,285 L262,285" stroke="#c8102e"/><g class="rise" style="animation-delay:0.08s"><rect x="262" y="160" width="200" height="250" rx="16" fill="#fdebd9" stroke="#f38020" stroke-width="1.6"/><circle cx="292" cy="160" r="15" fill="#f38020"/><text x="292" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">2</text><rect x="332" y="184" width="60" height="60" rx="14" fill="#fffdf8" stroke="#e6dccb"/><g transform="translate(347 199) scale(1.2500)" fill="none" stroke="#f38020" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></g><text x="362" y="276" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241a16" text-anchor="middle">Headers</text><text x="362" y="300" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">CSP, frame DENY, nosniff</text><rect x="276" y="338" width="172" height="56" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="362" y="358" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#f38020" text-anchor="middle" letter-spacing="1.4">STOPS</text><text x="362" y="378" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#241a16" text-anchor="middle">clickjacking, injected scripts</text></g><path d="M462,285 L484,285" fill="none" stroke="#66594f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M462,285 L484,285" stroke="#c8102e"/><g class="rise" style="animation-delay:0.16s"><rect x="484" y="160" width="200" height="250" rx="16" fill="#fbe3e4" stroke="#c8102e" stroke-width="1.6"/><circle cx="514" cy="160" r="15" fill="#c8102e"/><text x="514" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">3</text><rect x="554" y="184" width="60" height="60" rx="14" fill="#fffdf8" stroke="#e6dccb"/><g transform="translate(569 199) scale(1.2500)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="1.2" fill="#c8102e" stroke="none"/><circle cx="14.5" cy="14" r="1.2" fill="#c8102e" stroke="none"/><circle cx="14" cy="8.5" r="1" fill="#c8102e" stroke="none"/></g><text x="584" y="276" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241a16" text-anchor="middle">Session</text><text x="584" y="300" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">HttpOnly, SameSite=Lax</text><rect x="498" y="338" width="172" height="56" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="584" y="358" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c8102e" text-anchor="middle" letter-spacing="1.4">STOPS</text><text x="584" y="378" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#241a16" text-anchor="middle">script access, cross-site posts</text></g><path d="M684,285 L706,285" fill="none" stroke="#66594f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M684,285 L706,285" stroke="#c8102e"/><g class="rise" style="animation-delay:0.24s"><rect x="706" y="160" width="200" height="250" rx="16" fill="#fbe3e4" stroke="#c8102e" stroke-width="1.6"/><circle cx="736" cy="160" r="15" fill="#c8102e"/><text x="736" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">4</text><rect x="776" y="184" width="60" height="60" rx="14" fill="#fffdf8" stroke="#e6dccb"/><svg x="791" y="199" width="30" height="30" viewBox="0 0 24 24"><path d="M19.088 2.477 24 7.606 12.521 20.485l-.925 1.038L0 7.559l5.108-5.082h13.98Zm-17.434 5.2 6.934-4.003H5.601L1.619 7.636l.035.041Zm12.117-4.003L3.333 9.7l2.149 2.588 10.809-6.241-.2-.346 2.851-1.646-.365-.381h-4.806Zm7.52 2.834L8.257 14.034h5.101v-.4h3.667l5.346-5.998-1.08-1.128Zm-7.129 10.338H9.268l2.36 2.843 2.534-2.843Z" fill="#3E67B1"/></svg><text x="806" y="276" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241a16" text-anchor="middle">Validation</text><text x="806" y="300" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">Zod schema per route</text><rect x="720" y="338" width="172" height="56" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="806" y="358" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c8102e" text-anchor="middle" letter-spacing="1.4">STOPS</text><text x="806" y="378" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#241a16" text-anchor="middle">malformed input</text></g><path d="M906,285 L928,285" fill="none" stroke="#66594f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M906,285 L928,285" stroke="#c8102e"/><g class="rise" style="animation-delay:0.32s"><rect x="928" y="160" width="200" height="250" rx="16" fill="#fbe3e4" stroke="#c8102e" stroke-width="1.6"/><circle cx="958" cy="160" r="15" fill="#c8102e"/><text x="958" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">5</text><rect x="998" y="184" width="60" height="60" rx="14" fill="#fffdf8" stroke="#e6dccb"/><g transform="translate(1013 199) scale(1.2500)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 20h14"/><path d="M5 8h14"/><path d="M5 8l-2.5 6h5zM19 8l-2.5 6h5z"/></g><text x="1028" y="276" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241a16" text-anchor="middle">Permission</text><text x="1028" y="300" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">role and ownership</text><rect x="942" y="338" width="172" height="56" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="1028" y="358" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c8102e" text-anchor="middle" letter-spacing="1.4">STOPS</text><text x="1028" y="378" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#241a16" text-anchor="middle">acting on others&#x27; data</text></g><path d="M1128,285 L1150,285" fill="none" stroke="#66594f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M1128,285 L1150,285" stroke="#c8102e"/><g class="rise" style="animation-delay:0.40s"><rect x="1150" y="160" width="200" height="250" rx="16" fill="#efe8dc" stroke="#241a16" stroke-width="1.6"/><circle cx="1180" cy="160" r="15" fill="#241a16"/><text x="1180" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#fffdf8" text-anchor="middle">6</text><rect x="1220" y="184" width="60" height="60" rx="14" fill="#fffdf8" stroke="#e6dccb"/><svg x="1235" y="199" width="30" height="30" viewBox="0 0 24 24"><path d="M21.678.521c-1.032-.92-2.28-.55-3.513.544a8.71 8.71 0 0 0-.547.535c-2.109 2.237-4.066 6.38-4.674 9.544.237.48.422 1.093.544 1.561a13.044 13.044 0 0 1 .164.703s-.019-.071-.096-.296l-.05-.146a1.689 1.689 0 0 0-.033-.08c-.138-.32-.518-.995-.686-1.289-.143.423-.27.818-.376 1.176.484.884.778 2.4.778 2.4s-.025-.099-.147-.442c-.107-.303-.644-1.244-.772-1.464-.217.804-.304 1.346-.226 1.478.152.256.296.698.422 1.186.286 1.1.485 2.44.485 2.44l.017.224a22.41 22.41 0 0 0 .056 2.748c.095 1.146.273 2.13.5 2.657l.155-.084c-.334-1.038-.47-2.399-.41-3.967.09-2.398.642-5.29 1.661-8.304 1.723-4.55 4.113-8.201 6.3-9.945-1.993 1.8-4.692 7.63-5.5 9.788-.904 2.416-1.545 4.684-1.931 6.857.666-2.037 2.821-2.912 2.821-2.912s1.057-1.304 2.292-3.166c-.74.169-1.955.458-2.362.629-.6.251-.762.337-.762.337s1.945-1.184 3.613-1.72C21.695 7.9 24.195 2.767 21.678.521m-18.573.543A1.842 1.842 0 0 0 1.27 2.9v16.608a1.84 1.84 0 0 0 1.835 1.834h9.418a22.953 22.953 0 0 1-.052-2.707c-.006-.062-.011-.141-.016-.2a27.01 27.01 0 0 0-.473-2.378c-.121-.47-.275-.898-.369-1.057-.116-.197-.098-.31-.097-.432 0-.12.015-.245.037-.386a9.98 9.98 0 0 1 .234-1.045l.217-.028c-.017-.035-.014-.065-.031-.097l-.041-.381a32.8 32.8 0 0 1 .382-1.194l.2-.019c-.008-.016-.01-.038-.018-.053l-.043-.316c.63-3.28 2.587-7.443 4.8-9.791.066-.069.133-.128.198-.194Z" fill="#003B57"/></svg><text x="1250" y="276" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241a16" text-anchor="middle">Data</text><text x="1250" y="300" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">bound parameters</text><text x="1250" y="316" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="middle">guarded writes</text><rect x="1164" y="338" width="172" height="56" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="1250" y="358" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#241a16" text-anchor="middle" letter-spacing="1.4">STOPS</text><text x="1250" y="378" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#241a16" text-anchor="middle">SQL injection, overbooking</text></g><rect x="40" y="440" width="1320" height="84" rx="14" fill="#fffdf8" stroke="#e6dccb"/><g transform="translate(62 466) scale(1.2500)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g><text x="108" y="474" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#241a16" text-anchor="start">Passwords: PBKDF2-SHA256 with a random salt. Sessions: random tokens, stored only as SHA-256 hashes.</text><text x="108" y="498" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c8102e" text-anchor="start">Demo-strength by design: 10,000 rounds, sessions expire only with the 30-day cookie, and no login rate limit.</text><circle class="pkt" r="6" fill="#c8102e" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M240,285 L262,285'); animation-delay: 0.00s"/><circle class="pkt" r="6" fill="#c8102e" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M462,285 L484,285'); animation-delay: 0.90s"/><circle class="pkt" r="6" fill="#c8102e" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M684,285 L706,285'); animation-delay: 1.80s"/><circle class="pkt" r="6" fill="#c8102e" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M906,285 L928,285'); animation-delay: 2.70s"/><circle class="pkt" r="6" fill="#c8102e" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M1128,285 L1150,285'); animation-delay: 3.60s"/>
</svg>
