<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="t d">
<title id="t">How Collab Board works</title>
<desc id="d">Businesses post collabs and review applicants; creators browse, apply, visit and post; the board guarantees no collab is overbooked.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66594f"/></marker></defs>
<style>
.flow { fill: none; stroke-width: 2.4; stroke-dasharray: 4 10; stroke-opacity: 0; animation: flow 1.2s linear infinite; }
@keyframes flow { from { stroke-dashoffset: 14; stroke-opacity: .8; } to { stroke-dashoffset: 0; stroke-opacity: .8; } }
.pkt { opacity: 0; offset-rotate: 0deg; animation: pkt 4.5s linear infinite; }
@keyframes pkt { 0% { offset-distance: 0%; opacity: 1; } 20.00% { offset-distance: 100%; opacity: 1; } 20.60%, 100% { offset-distance: 100%; opacity: 0; } }
.rise { animation: rise .7s cubic-bezier(.2,.7,.1,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .flow, .pkt, .rise { animation: none; } .pkt { opacity: 0; } }
</style>
<rect width="1400" height="640" rx="22" fill="#faf5ea"/>
<text x="40" y="62" font-family="Ultra, 'Rockwell Extra Bold', Rockwell, Georgia, serif" font-size="34" font-weight="900" fill="#241a16" text-anchor="start">How Collab Board works</text><text x="42" y="92" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#66594f" text-anchor="start">Two sides, one board. Every arrow is something a person does in the app.</text><rect x="40" y="108" width="1320" height="1.5" fill="#e6dccb"/><g class="rise" style="animation-delay:0.00s"><rect x="40" y="160" width="360" height="430" rx="16" fill="#fbe9bf" stroke="#8a5a00" stroke-width="1.6"/><rect x="54" y="147" width="141.0" height="26" rx="13" fill="#8a5a00"/><g transform="translate(62 151) scale(0.6667)" fill="none" stroke="#fffdf8" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4" fill="#f2b632" stroke="#241a16"/></g><text x="86" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fffdf8" text-anchor="start" letter-spacing="1.2">BUSINESSES</text></g><g class="rise" style="animation-delay:0.10s"><rect x="60" y="190" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="60" y="200" width="3.5" height="42" rx="1.75" fill="#f2b632"/><g transform="translate(72 207.0) scale(1.1667)" fill="none" stroke="#8a5a00" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v5a2.25 2.25 0 0 1-4.5 0 2.25 2.25 0 0 1-4.5 0 2.25 2.25 0 0 1-4.5 0A2.25 2.25 0 0 1 3 10z"/><path d="M5 13v7h14v-7"/></g><text x="110" y="218.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Post a collab</text><text x="110" y="235.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">offer, what to post, spots, end date</text></g><g class="rise" style="animation-delay:0.16s"><rect x="60" y="266" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="60" y="276" width="3.5" height="42" rx="1.75" fill="#f2b632"/><g transform="translate(72 283.0) scale(1.1667)" fill="none" stroke="#8a5a00" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></g><text x="110" y="294.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Fill it with AI</text><text x="110" y="311.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">one sentence becomes a draft</text></g><g class="rise" style="animation-delay:0.22s"><rect x="60" y="342" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="60" y="352" width="3.5" height="42" rx="1.75" fill="#f2b632"/><g transform="translate(72 359.0) scale(1.1667)" fill="none" stroke="#8a5a00" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g><text x="110" y="370.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Find creators</text><text x="110" y="387.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">search, AI summary, invite</text></g><g class="rise" style="animation-delay:0.28s"><rect x="60" y="418" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="60" y="428" width="3.5" height="42" rx="1.75" fill="#f2b632"/><g transform="translate(72 435.0) scale(1.1667)" fill="none" stroke="#8a5a00" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></g><text x="110" y="446.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Review applicants</text><text x="110" y="463.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">accept or decline</text></g><g class="rise" style="animation-delay:0.34s"><rect x="60" y="494" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="60" y="504" width="3.5" height="42" rx="1.75" fill="#f2b632"/><g transform="translate(72 511.0) scale(1.1667)" fill="none" stroke="#8a5a00" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></g><text x="110" y="522.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Mark complete</text><text x="110" y="539.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">after the post is live</text></g><g class="rise" style="animation-delay:0.00s"><rect x="1000" y="160" width="360" height="430" rx="16" fill="#e2efe2" stroke="#2f6b3f" stroke-width="1.6"/><rect x="1014" y="147" width="122.4" height="26" rx="13" fill="#2f6b3f"/><g transform="translate(1022 151) scale(0.6667)" fill="none" stroke="#fffdf8" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" stroke="#c8102e"/><circle cx="12" cy="12" r="5" stroke="#2f6b3f"/><circle cx="12" cy="3.5" r="1.6" fill="#241a16" stroke="none"/></g><text x="1046" y="165" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fffdf8" text-anchor="start" letter-spacing="1.2">CREATORS</text></g><g class="rise" style="animation-delay:0.10s"><rect x="1020" y="190" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="1020" y="200" width="3.5" height="42" rx="1.75" fill="#2f6b3f"/><g transform="translate(1032 207.0) scale(1.1667)" fill="none" stroke="#2f6b3f" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></g><text x="1070" y="218.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Browse the board</text><text x="1070" y="235.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">every live collab</text></g><g class="rise" style="animation-delay:0.16s"><rect x="1020" y="266" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="1020" y="276" width="3.5" height="42" rx="1.75" fill="#2f6b3f"/><g transform="translate(1032 283.0) scale(1.1667)" fill="none" stroke="#2f6b3f" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></g><text x="1070" y="294.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Apply in one line</text><text x="1070" y="311.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">140 characters</text></g><g class="rise" style="animation-delay:0.22s"><rect x="1020" y="342" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="1020" y="352" width="3.5" height="42" rx="1.75" fill="#2f6b3f"/><g transform="translate(1032 359.0) scale(1.1667)" fill="none" stroke="#2f6b3f" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></g><text x="1070" y="370.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Answer invites</text><text x="1070" y="387.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">accept or decline</text></g><g class="rise" style="animation-delay:0.28s"><rect x="1020" y="418" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="1020" y="428" width="3.5" height="42" rx="1.75" fill="#2f6b3f"/><g transform="translate(1032 435.0) scale(1.1667)" fill="none" stroke="#2f6b3f" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2" transform="rotate(-8 12 12)"/><path d="M7.5 12.5h9" transform="rotate(-8 12 12)"/></g><text x="1070" y="446.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Visit with a code</text><text x="1070" y="463.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">shown at the counter</text></g><g class="rise" style="animation-delay:0.34s"><rect x="1020" y="494" width="320" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="1020" y="504" width="3.5" height="42" rx="1.75" fill="#2f6b3f"/><g transform="translate(1032 511.0) scale(1.1667)" fill="none" stroke="#2f6b3f" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g><text x="1070" y="522.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Add the post link</text><text x="1070" y="539.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">https only</text></g><g class="rise" style="animation-delay:0.20s"><rect x="470" y="200" width="460" height="350" rx="16" fill="#fbe3e4" stroke="#c8102e" stroke-width="1.6"/><rect x="484" y="187" width="159.60000000000002" height="26" rx="13" fill="#c8102e"/><g transform="translate(492 191) scale(0.6667)" fill="none" stroke="#fffdf8" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2" transform="rotate(-8 12 12)"/><path d="M7.5 12.5h9" transform="rotate(-8 12 12)"/></g><text x="516" y="205" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fffdf8" text-anchor="start" letter-spacing="1.2">COLLAB BOARD</text></g><g class="rise" style="animation-delay:0.30s"><rect x="492" y="232" width="416" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="492" y="242" width="3.5" height="42" rx="1.75" fill="#c8102e"/><g transform="translate(504 249.0) scale(1.1667)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9M3 16h9"/><path d="M12 8l5 4-5 4"/><circle cx="19.5" cy="12" r="1.8" fill="#c8102e" stroke="none"/></g><text x="542" y="260.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Never overbooked</text><text x="542" y="277.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">one SQL statement guards every spot</text></g><g class="rise" style="animation-delay:0.36s"><rect x="492" y="308" width="416" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="492" y="318" width="3.5" height="42" rx="1.75" fill="#c8102e"/><g transform="translate(504 325.0) scale(1.1667)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="7" height="7" rx="2" fill="#f2b632" stroke="#241a16"/><circle cx="16.5" cy="11.5" r="4" stroke="#2f6b3f"/><path d="M3 20h18"/></g><text x="542" y="336.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">One account per business</text><text x="542" y="353.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">enforced by a unique index</text></g><g class="rise" style="animation-delay:0.42s"><rect x="492" y="384" width="416" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="492" y="394" width="3.5" height="42" rx="1.75" fill="#c8102e"/><g transform="translate(504 401.0) scale(1.1667)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2" transform="rotate(-8 12 12)"/><path d="M7.5 12.5h9" transform="rotate(-8 12 12)"/></g><text x="542" y="412.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Clear statuses</text><text x="542" y="429.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">Applied, Accepted, Posted, Completed</text></g><g class="rise" style="animation-delay:0.48s"><rect x="492" y="460" width="416" height="62" rx="11" fill="#fffdf8" stroke="#e6dccb"/><rect x="492" y="470" width="3.5" height="42" rx="1.75" fill="#c8102e"/><g transform="translate(504 477.0) scale(1.1667)" fill="none" stroke="#c8102e" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="7" rx="1.5" transform="rotate(-4 7 7.5)"/><rect x="13" y="4" width="8" height="7" rx="1.5" transform="rotate(3 17 7.5)"/><rect x="3" y="13" width="8" height="7" rx="1.5" transform="rotate(2 7 16.5)"/><rect x="13" y="13" width="8" height="7" rx="1.5" stroke-dasharray="2 2"/></g><text x="542" y="488.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241a16" text-anchor="start">Profile wall</text><text x="542" y="505.0" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66594f" text-anchor="start">completed collabs pinned up</text></g><path d="M400,260 L470,260" fill="none" stroke="#8a5a00" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M400,260 L470,260" stroke="#f2b632"/><rect x="410.25" y="232" width="49.5" height="20" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="435" y="246" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#66594f" text-anchor="middle">posts</text><path d="M1000,300 L930,300" fill="none" stroke="#2f6b3f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M1000,300 L930,300" stroke="#2f6b3f"/><rect x="933.55" y="272" width="62.9" height="20" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="965" y="286" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#66594f" text-anchor="middle">applies</text><path d="M470,420 L400,420" fill="none" stroke="#8a5a00" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M470,420 L400,420" stroke="#f2b632"/><rect x="393.5" y="392" width="83.0" height="20" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="435" y="406" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#66594f" text-anchor="middle">applicants</text><path d="M930,460 L1000,460" fill="none" stroke="#2f6b3f" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" d="M930,460 L1000,460" stroke="#2f6b3f"/><rect x="930.2" y="432" width="69.6" height="20" rx="10" fill="#fffdf8" stroke="#e6dccb"/><text x="965" y="446" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#66594f" text-anchor="middle">accepted</text><g class="rise" style="animation-delay:0.60s"><rect x="400" y="574" width="600" height="40" rx="20" fill="#241a16"/><text x="700" y="599" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#faf5ea" text-anchor="middle">Outcome: businesses gain content and reach; creators build a track record</text></g><circle class="pkt" r="6" fill="#f2b632" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M400,260 L470,260'); animation-delay: 0.00s"/><circle class="pkt" r="6" fill="#2f6b3f" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M1000,300 L930,300'); animation-delay: 0.90s"/><circle class="pkt" r="6" fill="#f2b632" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M470,420 L400,420'); animation-delay: 1.80s"/><circle class="pkt" r="6" fill="#2f6b3f" stroke="#fffdf8" stroke-width="2" style="offset-path: path('M930,460 L1000,460'); animation-delay: 2.70s"/>
