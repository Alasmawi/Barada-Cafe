<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-labelledby="t d">
<title id="t">Application journey</title>
<desc id="d">An application moves from Applied to Accepted to Posted to Completed.</desc>
<style>
.s { transform-box: fill-box; transform-origin: center; animation: hit 6.4s ease-out infinite both; }
@keyframes hit { 0% { transform: scale(1); } 4% { transform: scale(1.22); } 9% { transform: scale(1); } 100% { transform: scale(1); } }
.dot { animation: travel 6.4s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes travel { 0% { transform: translateX(0); } 75% { transform: translateX(630px); } 100% { transform: translateX(630px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="880" height="170" rx="18" fill="#faf5ea"/>
<line x1="120" y1="78" x2="750" y2="78" stroke="#241a16" stroke-width="3" stroke-linecap="round"/>
<circle class="dot" cx="120" cy="78" r="8" fill="#c8102e"/>
<g transform="translate(120 78)"><g class="s" style="animation-delay:0.0s"><rect x="-38.400000000000006" y="-15.0" width="76.80000000000001" height="30" rx="15.0" fill="#dee6da" stroke="#241a16" stroke-width="2"/><text x="0" y="5.3999999999999995" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241a16">Applied</text></g></g><text x="120" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Creator applies</text><g transform="translate(330 78)"><g class="s" style="animation-delay:1.6s"><rect x="-42.6" y="-15.0" width="85.2" height="30" rx="15.0" fill="#f6d7d8" stroke="#241a16" stroke-width="2"/><text x="0" y="5.3999999999999995" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241a16">Accepted</text></g></g><text x="330" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Business accepts, code issued</text><g transform="translate(540 78)"><g class="s" style="animation-delay:3.2s"><rect x="-34.2" y="-15.0" width="68.4" height="30" rx="15.0" fill="#dee4e6" stroke="#241a16" stroke-width="2"/><text x="0" y="5.3999999999999995" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241a16">Posted</text></g></g><text x="540" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Creator adds post link</text><g transform="translate(750 78)"><g class="s" style="animation-delay:4.8s"><rect x="-46.800000000000004" y="-15.0" width="93.60000000000001" height="30" rx="15.0" fill="#241a16" stroke="#241a16" stroke-width="2"/><text x="0" y="5.3999999999999995" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fffdf8">Completed</text></g></g><text x="750" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Business marks complete</text>
</svg>
