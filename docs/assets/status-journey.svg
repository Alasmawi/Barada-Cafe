<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-labelledby="t d">
<title id="t">Application journey</title>
<desc id="d">An application moves from Applied to Accepted to Posted to Completed.</desc>
<style>
.s { transform-box: fill-box; transform-origin: center; animation: hit 6.4s ease-out infinite both; }
@keyframes hit { 0% { transform: scale(1); } 4% { transform: scale(1.22); } 9% { transform: scale(1); } 100% { transform: scale(1); } }
.dot { animation: travel 6.4s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes travel { 0% { transform: translateX(0); } 75% { transform: translateX(630px); } 100% { transform: translateX(630px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="880" height="170" rx="18" fill="#faf5ea"/>
<line x1="120" y1="78" x2="750" y2="78" stroke="#e6dccb" stroke-width="4" stroke-linecap="round"/>
<circle class="dot" cx="120" cy="78" r="8" fill="#c8102e"/>
<g transform="translate(120 78) rotate(-7)"><g class="s" style="animation-delay:0.0s"><rect x="-45.0" y="-16" width="90" height="32" rx="5" fill="#fffdf8" stroke="#2f6b3f" stroke-width="2.5"/><text x="0" y="6" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6" fill="#2f6b3f">APPLIED</text></g></g><text x="120" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Creator applies</text><g transform="translate(330 78) rotate(-7)"><g class="s" style="animation-delay:1.6s"><rect x="-50.0" y="-16" width="100" height="32" rx="5" fill="#fffdf8" stroke="#c8102e" stroke-width="2.5"/><text x="0" y="6" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6" fill="#c8102e">ACCEPTED</text></g></g><text x="330" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Business accepts, code issued</text><g transform="translate(540 78) rotate(-7)"><g class="s" style="animation-delay:3.2s"><rect x="-40.0" y="-16" width="80" height="32" rx="5" fill="#fffdf8" stroke="#2f5f8a" stroke-width="2.5"/><text x="0" y="6" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6" fill="#2f5f8a">POSTED</text></g></g><text x="540" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Creator adds post link</text><g transform="translate(750 78) rotate(-7)"><g class="s" style="animation-delay:4.8s"><rect x="-55.0" y="-16" width="110" height="32" rx="5" fill="#fffdf8" stroke="#241a16" stroke-width="2.5"/><text x="0" y="6" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6" fill="#241a16">COMPLETED</text></g></g><text x="750" y="138" text-anchor="middle" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#66594f">Business marks complete</text>
</svg>
