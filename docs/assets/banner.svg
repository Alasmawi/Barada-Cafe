<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Collab Board</title>
<desc id="d">Collab Board banner: collab cards drawn as stickers in each business's colour, one marked Accepted.</desc>
<style>
.rise { animation: rise .8s cubic-bezier(.2,.7,.1,1) both; }
.stamp { transform-box: fill-box; transform-origin: center; animation: thump .45s cubic-bezier(.3,1.6,.6,1) both; }
.ring { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }
@keyframes thump { from { opacity: 0; transform: scale(1.5); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1200" height="340" rx="20" fill="#faf5ea"/>
<text x="56" y="160" font-family="Ultra, 'Rockwell Extra Bold', Rockwell, Georgia, serif" font-size="64" font-weight="900" fill="#241a16">Collab Board</text>
<text x="58" y="204" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#66594f">Businesses post collabs. Creators apply.</text>
<g transform="translate(58 234)">
  <rect width="30" height="30" rx="7" fill="#f2b632" stroke="#241a16" stroke-width="2"/>
  <text x="42" y="21" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241a16">Businesses are squares</text>
  <g transform="translate(244 15)"><g class="ring">
    <circle r="15" fill="none" stroke="#c8102e" stroke-width="2.5"/>
    <circle r="10" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>
    <circle r="5" fill="none" stroke="#f2b632" stroke-width="2.5"/>
    <circle cx="0" cy="-15" r="3" fill="#241a16"/><circle cx="0" cy="15" r="3" fill="#241a16"/>
  </g></g>
  <text x="268" y="21" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241a16">creators are rings</text>
</g>
